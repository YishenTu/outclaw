name: memory-distill
schedule: "47 5 * * *"
model: opus
effort: high
enabled: true
prompt: |
  Distill cross-cutting operating guidance from yesterday's daily memory into MEMORY.md's Standing Notes section.

  Read MEMORY.md and yesterday's `daily-memories/YYYY-MM-DD.md`.

  Your target is the `## Standing Notes` section only. Do NOT touch:
  - `## Schema Router`
  - `## Flat Notes`

  Standing Notes holds cross-cutting knowledge the agent should carry into every session:
  - Stable preferences and durable decisions that apply across all work.
  - Operating rules learned through experience that belong nowhere else.
  - Lessons that should shape future behavior regardless of topic.

  Do NOT promote:
  - Schema-bound content (project specifics, initiative state, topic-specific facts) — those are routed into `schemas/` by the routing cron.
  - Personality or working-style observations — those belong in SOUL.md.
  - Structural rules and instructions — those belong in AGENTS.md.
  - User profile facts — those belong in USER.md.
  - Routine task logs, one-off operations, or anything already captured elsewhere.
  - Anything re-derivable by reading a file or running a command.

  Remove outdated entries from Standing Notes that no longer apply.

  The bar is high: Standing Notes matters in every session, so every line pays a context tax. Keep it lean.

  Reply with a summary of changes, or reply only `NO_REPLY` if none, no explanation.
