name: memory-distill
schedule: "47 5 * * *"
model: opus
effort: high
enabled: true
prompt: |
  Distill cross-cutting operating guidance from yesterday's daily memory into MEMORY.md's Standing Notes section.

  ## Scope

  - Read `MEMORY.md` and yesterday's `daily-memories/<yesterday>.md`.
  - Only modify `MEMORY.md`'s `## Standing Notes` section. Do NOT touch `## Schema Router` or `## Flat Notes`.

  ## What Standing Notes is for

  Cross-cutting knowledge the agent carries into every session: stable preferences, durable decisions, operating rules learned through experience, lessons that shape future behavior regardless of topic.

  ## What to promote

  Promote a daily-memory line into Standing Notes only if it represents:
  - A stable preference or durable decision that applies across all work.
  - An operating rule learned through experience that belongs nowhere else.
  - A lesson that would plausibly apply across different topics — not just the next time the same incident recurs.

  ## What NOT to promote

  - Schema-bound content (project, person, or topic specifics) — those are routed into `schemas/` by `memory-route`.
  - Personality or working-style observations — belong in `SOUL.md`.
  - Structural rules and instructions — belong in `AGENTS.md`.
  - User profile facts — belong in `USER.md`.
  - Routine task logs, one-off operations, or anything already captured elsewhere.
  - Anything re-derivable by reading a file or running a command.
  - Single-incident postmortems or specific troubleshooting stories. When in doubt, leave it in the daily memory.

  ## Writing discipline

  - Wrap proper-noun entities in `[[X]]` — people, places, projects, products, tools, named events, schema/note filenames, and category-level named entities (cuisines, genres, drink types). Don't wrap generic concepts (preference, context, style). Variants resolve via the canonical file's frontmatter `aliases:`.
  - The bar is high: Standing Notes pays a context tax in every session. Keep it lean.
  - Remove outdated entries that no longer apply.

  ## After

  Reply with a one-line summary of changes, or `NO_REPLY` if none.
