# Cron job template. Copy to a new file under cron/ (e.g. `cron/my-task.yaml`)
# and fill in. Files starting with `_` are ignored by the scheduler, so this
# template stays inert.
#
# REQUIRED fields:
#   name      — unique identifier, kebab-case
#   schedule  — recurring cron expression: "minute hour day-of-month month day-of-week"
#               examples:
#                 "0 9 * * 1"     -> every Monday at 09:00
#                 "*/30 * * * *"  -> every 30 minutes
#                 "45 5 * * *"    -> every day at 05:45
#   runAt     — one-time ISO 8601 datetime with explicit offset
#               examples:
#                 "2026-04-29T09:00:00+08:00"
#                 "2026-04-29T01:00:00Z"
#               Use exactly one of schedule or runAt.
#   model     — provider-qualified model, e.g. openai-codex/gpt-5.5
#   prompt    — the task description the agent reads when the cron fires
#
# OPTIONAL fields:
#   enabled   — false to disable without deleting (default: true)
#   effort    — low | medium | high | xhigh | max (default: runtime config)
#   timezone  — UTC offset for the schedule: "UTC", "UTC+8", "UTC-7"
#               (default: daemon's local timezone — leave this field OUT
#               unless the user explicitly specifies a timezone; only valid
#               with schedule, not runAt)
#
# Prompt guidelines:
#   - Be specific about what to read, what to decide, what to write.
#   - Name concrete files/paths the agent should touch.
#   - Close with a response contract, e.g. "Reply with a summary of changes, or
#     reply `NO_REPLY` if nothing needed work."
#   - Keep it self-contained — the cron agent has no conversation history.

name: <job-name>
schedule: "0 9 * * 1"
# For one-time jobs, replace schedule with:
# runAt: "2026-04-29T09:00:00+08:00"
enabled: true
model: openai-codex/gpt-5.5
# effort: medium
# timezone: UTC
prompt: |
  <describe the task here — what to read, what to produce, what to write.>

  <State the response contract at the end.>

  Reply with a short summary of what you did, or `NO_REPLY` if nothing needed work.
